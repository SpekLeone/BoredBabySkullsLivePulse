<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>BBS LIVE PULSE</title>
    <style>
        body { 
            background: #000; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif; 
        }
        
        /* Control Panel - OVERLAID ON THE IMAGE + HIDDEN UNTIL HOVER / TOUCH */
        #controls {
            position: absolute;
            top: 2cqi;
            left: 3cqi;
            right: 3cqi;
            z-index: 100;
            background: rgba(0,0,0,0.92);
            padding: 2.5cqi 3cqi;
            border: 1px solid #0f0;
            color: #0f0;
            font-size: 1.5cqi;
            border-radius: 1.5cqi;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
            max-width: 92cqi;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        /* Desktop hover */
        body:hover #controls {
            opacity: 1;
            pointer-events: auto;
        }

        .group { 
            display: flex; 
            gap: 1.0cqi; 
            align-items: center; 
            margin-bottom: 2cqi; 
            flex-wrap: wrap; 
            justify-content: left;
        }
        button { 
            background: #111; 
            border: 1px solid #0f0; 
            color: #0f0; 
            padding: 0.5cqi 1.5cqi; 
            cursor: pointer; 
            font-size: 1.5cqi; 
            text-transform: uppercase; 
            border-radius: 0.5cqi;
        }
        button:hover { 
            background: #0f0; 
            color: #000; 
        }
        #windSlider { 
            width: 10cqi; 
            accent-color: #0f0; 
            cursor: ew-resize; 
        }
        
        /* Manual Location UI Overlay Dashboard */
        #locationDashboard { 
            background: rgba(10, 25, 10, 0.95); 
            border-top: 1px dashed #0f0; 
            padding-top: 2cqi; 
            margin-top: 1cqi; 
            display: none; 
        }
        .input-row { 
            display: flex; 
            gap: 1.5cqi; 
            margin-bottom: 1.5cqi; 
            align-items: center; 
        }
        .input-row input { 
            background: #000; 
            border: 1px solid #0f0; 
            color: #0f0; 
            padding: 1cqi; 
            font-size: 1.8cqi; 
            font-family: monospace; 
            width: 22cqi; 
        }
        .input-row label { 
            font-size: 1.6cqi; 
            width: 9cqi; 
            display: inline-block; 
        }

        /* Container wrapper ensures the overlay scales relative to the image size */
        .container {
            position: relative;
            container-type: inline-size;
            width: 100vw;
            height: 100vw;
            max-width: 100vh;
            max-height: 100vh;
        }
        canvas { 
            image-rendering: pixelated; 
            width: 100%; 
            height: 100%; 
            border: 1px solid #333; 
        }

        /* Interactive Ticker Overlay Styling */
        #statusOverlay {
            position: absolute;
            bottom: 0.5cqi;
            right: 0.5cqi;
            left: 0.5cqi;
            background: rgba(0, 0, 0, 0.9);
            border: 0.25cqi solid #0f0;
            z-index: 90;
            padding: 1.5cqi 2cqi;
            box-sizing: border-box;
            border-radius: 0.8cqi;
            
            color: #0f0;
            font-size: 2.1cqi;
            text-transform: uppercase;
            letter-spacing: 0.15cqi;
            font-family: monospace;
            font-weight: bold;
            text-shadow: 0 0 3px rgba(0, 255, 0, 0.5);
            
            white-space: normal;
            word-break: break-word;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="nftCanvas" width="128" height="128"></canvas>
        
        <!-- Control panel overlaid directly on the image -->
        <div id="controls">
            <div class="group">
                <strong>WEATHER:</strong>
                <button onclick="setWeather('CLEAR', 0)">CLEAR</button>
                <button onclick="setWeather('CLOUDY', 3)">CLOUDY</button>
                <button onclick="setWeather('RAIN', 61)">LIGHT RAIN</button>
                <button onclick="setWeather('RAIN', 65)">HEAVY RAIN</button>
                <button onclick="setWeather('SNOW', 71)">SNOW</button>
                <button onclick="setWeather('STORM', 95)">STORM</button>
                <button onclick="setWeather('FOG', 45)">FOG</button>
            </div>
            
            <div class="group">
                <strong>TIME:</strong>
                <button onclick="setTime(8)">MORNING</button>
                <button onclick="setTime(14)">AFTERNOON</button>
                <button onclick="setTime(19)">EVENING</button>
                <button onclick="setTime(23)">NIGHT</button>
				<strong>WIND:</strong>
                <input type="range" min="-100" max="100" value="15" id="windSlider" oninput="windSpeed = parseInt(this.value)">
            </div>

            <div class="group">
				<button onclick="location.reload()" style="font-weight:bold; background:#0f0; color:#000;">SYNC LIVE</button>
				<button onclick="toggleDashboard()">MANUAL SEARCH</button> 
				<strong>GLASSES:</strong>
                <button onclick="toggleGlasses()" id="glassesBtn" style="background:#0f0; color:#000; font-weight:bold;">ON</button>                               
            </div>
			
            <div id="locationDashboard">
                <div class="input-row">
                    <label>BY CITY:</label>
                    <input type="text" id="inputCity" placeholder="e.g. Hasselt, Tokyo">
                    <button onclick="searchByCityName()">GO</button>
                </div>
                <div class="input-row">
                    <label>COORDS:</label>
                    <input type="text" id="inputLat" placeholder="Latitude" style="width:50px;">
                    <input type="text" id="inputLon" placeholder="Longitude" style="width:50px;">
                    <button onclick="searchByCoordinates()">SET</button>
                </div>
            </div>
        </div>

        <div id="statusOverlay">IDENTIFYING...</div>
    </div>

    <script>
    const res = 128;
    const canvas = document.getElementById('nftCanvas');
    const overlayStatus = document.getElementById('statusOverlay');
    const ctx = canvas.getContext('2d', { alpha: false });
    const img = new Image();
    
    // Core Config
    const CID = "QmNd3AkdLB1HcFNapYtsXwtkjSy1RYxZD9CF6nScDZGgDG";
    const ID = "4"; 

    const urlParams = new URLSearchParams(window.location.search);
    const dynamicID = urlParams.get('id') || urlParams.get('ID') || urlParams.get('Id') || ID;

    img.crossOrigin = "Anonymous";
    img.src = `https://gateway.pinata.cloud/ipfs/${CID}/BoredBabySkulls%20${dynamicID}.png`;

    let originalPixels = [];
    let isDataReady = false; 
    let currentWeather = "CLEAR";
    let weatherCode = 0;
    let windSpeed = 15;
    let manualHour = null;
    let currentTemp = "--";
    let rainDrops = [];
    let flashTimer = 0;
    let locationSource = "IDENTIFYING...";
    let userTimezone = "UTC";

    // Glasses toggle state
    let showGlasses = true;

    const fallbackLat = 50.8504;
    const fallbackLon = 4.3488;
    let currentLat = fallbackLat;
    let currentLon = fallbackLon;

    const imgData = ctx.createImageData(res, res);
    const d = imgData.data;

    for(let i=0; i<100; i++) {
        rainDrops.push({ x: Math.random() * res, y: Math.random() * res, v: 2 + Math.random() * 3, l: 4 + Math.random() * 4, sz: Math.floor(Math.random() * 2) + 1 });
    }

    function toggleDashboard() {
        const panel = document.getElementById('locationDashboard');
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    }

    // Toggle glasses ON / OFF
    function toggleGlasses() {
        showGlasses = !showGlasses;
        const btn = document.getElementById('glassesBtn');
        if (btn) {
            btn.innerText = showGlasses ? "ON" : "OFF";
            btn.style.background = showGlasses ? "#0f0" : "#111";
            btn.style.color = showGlasses ? "#000" : "#0f0";
        }
    }

    // Auto-hide on mobile after 5 seconds + tap to toggle
    let controlHideTimeout = null;
    function initMobileControls() {
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 2;
        if (!isTouchDevice) return;

        const container = document.querySelector('.container');
        const controls = document.getElementById('controls');

        container.addEventListener('click', function(e) {
            if (e.target.closest('#controls')) return;

            if (controlHideTimeout) clearTimeout(controlHideTimeout);

            const visible = controls.style.opacity === '1';

            if (visible) {
                controls.style.opacity = '0';
                controls.style.pointerEvents = 'none';
            } else {
                controls.style.opacity = '1';
                controls.style.pointerEvents = 'auto';
                controlHideTimeout = setTimeout(() => {
                    controls.style.opacity = '0';
                    controls.style.pointerEvents = 'none';
                }, 5000);
            }
        });
    }

    async function searchByCityName() {
        let rawQuery = document.getElementById('inputCity').value;
        if(!rawQuery) return;
        let query = rawQuery.replace(/\u00ad/g, '').trim();
        if(!query) return;
        try {
            if(overlayStatus) overlayStatus.innerText = "SEARCHING...";
            let resVal = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
            if (!resVal.ok) throw new Error("API Server Error");
            let data = await resVal.json();
            if (!data.results || data.results.length === 0) {
                let normalized = query.toLowerCase().replace(/ue/g, 'u').replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ss/g, 's');
                resVal = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(normalized)}&count=1&language=en&format=json`);
                if (resVal.ok) data = await resVal.json();
            }
            if ((!data.results || data.results.length === 0) && query.length > 12) {
                let fallbackSearch = /[\s\-]+/.test(query) ? query.split(/[\s\-]+/)[0] : query.substring(0, 12);
                resVal = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(fallbackSearch)}&count=1&language=en&format=json`);
                if (resVal.ok) data = await resVal.json();
            }
            if(data.results && data.results.length > 0) {
                const target = data.results[0];
                currentLat = target.latitude;
                currentLon = target.longitude;
                locationSource = query.length > 16 ? query.substring(0, 14).toUpperCase() + ".." : query.toUpperCase();
                document.getElementById('inputLat').value = currentLat.toFixed(4);
                document.getElementById('inputLon').value = currentLon.toFixed(4);
                await fetchWeather(currentLat, currentLon);
            } else {
                if(overlayStatus) overlayStatus.innerText = "LOCATION NOT FOUND";
            }
        } catch(err) {
            if(overlayStatus) overlayStatus.innerText = "API ERROR - TRY SHORT NAME";
        }
    }

    async function searchByCoordinates() {
        const lat = parseFloat(document.getElementById('inputLat').value);
        const lon = parseFloat(document.getElementById('inputLon').value);
        if(isNaN(lat) || isNaN(lon)) return;
        currentLat = lat; currentLon = lon; locationSource = "CUSTOM COORDS";
        try {
            const geoFetch = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${currentLat}&longitude=${currentLon}&localityLanguage=en`);
            const geoData = await geoFetch.json();
            locationSource = (geoData.city || geoData.locality || "CUSTOM COORDS").toUpperCase();
        } catch(e) {}
        await fetchWeather(currentLat, currentLon);
    }

    async function fetchWeather(lat, lon) {
        try {
            const encodeTZ = encodeURIComponent(userTimezone);
            const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=${encodeTZ}`);
            const data = await r.json();
            windSpeed = Math.round(data.current_weather.windspeed);
            weatherCode = data.current_weather.weathercode;
            currentTemp = Math.round(data.current_weather.temperature); 
            if(document.getElementById('windSlider')) document.getElementById('windSlider').value = windSpeed;
            setWeatherByCode(weatherCode);
        } catch(e) { console.log("Weather API Error."); }
    }

    async function fetchLocationByIP() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            if (data && data.latitude && data.longitude) {
                currentLat = data.latitude;
                currentLon = data.longitude;
                locationSource = `${data.city.toUpperCase()}`; 
            } else throw new Error("Payload error");
        } catch (e) {
            const lang = (navigator.language || "").toLowerCase();
            const rawOffset = new Date().getTimezoneOffset();
            const hoursOffset = -Math.round(rawOffset / 60);
            locationSource = `GRID (UTC${hoursOffset >= 0 ? '+' : ''}${hoursOffset})`;

            if (hoursOffset === 0) {
                if (lang.startsWith('pt')) { currentLat = 38.7223; currentLon = -9.1393; locationSource = "LISBON"; }
                else { currentLat = 51.5074; currentLon = -0.1278; locationSource = "LONDON"; }
            } else if (hoursOffset === 1 || hoursOffset === 2) {
                if (lang.startsWith('fr')) { currentLat = 48.8566; currentLon = 2.3522; locationSource = "PARIS"; }
                else if (lang.startsWith('de')) { currentLat = 52.5200; currentLon = 13.4050; locationSource = "BERLIN"; }
                else if (lang.startsWith('it')) { currentLat = 41.9028; currentLon = 12.4964; locationSource = "ROME"; }
                else if (lang.startsWith('es')) { currentLat = 40.4168; currentLon = -3.7038; locationSource = "MADRID"; }
                else if (lang.startsWith('pl')) { currentLat = 52.2297; currentLon = 21.0122; locationSource = "WARSAW"; }
                else if (lang.startsWith('sv')) { currentLat = 59.3293; currentLon = 18.0686; locationSource = "STOCKHOLM"; }
                else if (lang.startsWith('no')) { currentLat = 59.9139; currentLon = 10.7522; locationSource = "OSLO"; }
                else if (lang.startsWith('da')) { currentLat = 55.6761; currentLon = 12.5683; locationSource = "COPENHAGEN"; }
                else if (lang.startsWith('fi')) { currentLat = 60.1699; currentLon = 24.9384; locationSource = "HELSINKI"; }
                else if (lang.startsWith('ar')) { currentLat = 30.0444; currentLon = 31.2357; locationSource = "CAIRO"; }
                else if (lang.includes('za')) { currentLat = -26.2041; currentLon = 28.0473; locationSource = "JOHANNESBURG"; }
                else { currentLat = 50.8504; currentLon = 4.3488; locationSource = "BRUSSELS"; }
            } else if (hoursOffset === 3) {
                if (lang.startsWith('el')) { currentLat = 37.9838; currentLon = 23.7275; locationSource = "ATHENS"; }
                else if (lang.startsWith('tr')) { currentLat = 41.0082; currentLon = 28.9784; locationSource = "ISTANBUL"; }
                else if (lang.startsWith('he')) { currentLat = 32.0853; currentLon = 34.7818; locationSource = "TEL AVIV"; }
                else if (lang.startsWith('ar')) { currentLat = 24.7136; currentLon = 46.6753; locationSource = "RIYADH"; }
                else if (lang.startsWith('ru')) { currentLat = 55.7558; currentLon = 37.6173; locationSource = "MOSCOW"; }
                else { currentLat = -1.2921; currentLon = 36.8219; locationSource = "NAIROBI"; }
            } else if (hoursOffset === 4) {
                currentLat = 25.2048; currentLon = 55.2708; locationSource = "DUBAI";
            } else if (hoursOffset === 5 || hoursOffset === 6) {
                if (lang.startsWith('ur')) { currentLat = 24.8607; currentLon = 67.0011; locationSource = "KARACHI"; }
                else { currentLat = 19.0760; currentLon = 72.8777; locationSource = "MUMBAI"; }
            } else if (hoursOffset === 7) {
                if (lang.startsWith('th')) { currentLat = 13.7563; currentLon = 100.5018; locationSource = "BANGKOK"; }
                else if (lang.startsWith('vi')) { currentLat = 21.0285; currentLon = 105.8542; locationSource = "HANOI"; }
                else { currentLat = -6.2088; currentLon = 106.8456; locationSource = "JAKARTA"; }
            } else if (hoursOffset === 8) {
                if (lang.startsWith('zh')) { currentLat = 31.2304; currentLon = 121.4737; locationSource = "SHANGHAI"; }
                else if (lang.startsWith('tl')) { currentLat = 14.5995; currentLon = 120.9842; locationSource = "MANILA"; }
                else { currentLat = 1.3521; currentLon = 103.8198; locationSource = "SINGAPORE"; }
            } else if (hoursOffset === 9) {
                if (lang.startsWith('ko')) { currentLat = 37.5665; currentLon = 126.9780; locationSource = "SEOUL"; }
                else { currentLat = 35.6762; currentLon = 139.6503; locationSource = "TOKYO"; }
            } else if (hoursOffset >= 10 && hoursOffset <= 13) {
                currentLat = -33.8688; currentLon = 151.2093; locationSource = "SYDNEY";
            } else if (hoursOffset === -3) {
                if (lang.startsWith('es')) { currentLat = -34.6037; currentLon = -58.3816; locationSource = "BUENOS AIRES"; }
                else { currentLat = -23.5505; currentLon = -46.6333; locationSource = "SAO PAULO"; }
            } else if (hoursOffset === -4 || hoursOffset === -5) {
                if (lang.startsWith('es')) { currentLat = 4.7110; currentLon = -74.0721; locationSource = "BOGOTA"; }
                else if (lang.startsWith('fr')) { currentLat = 45.5017; currentLon = -73.5673; locationSource = "MONTREAL"; }
                else { currentLat = 40.7128; currentLon = -74.0060; locationSource = "NEW YORK"; }
            } else if (hoursOffset === -6) {
                if (lang.startsWith('es')) { currentLat = 19.4326; currentLon = -99.1332; locationSource = "MEXICO CITY"; }
                else { currentLat = 41.8781; currentLon = -87.6298; locationSource = "CHICAGO"; }
            } else if (hoursOffset === -7 || hoursOffset === -8) {
                currentLat = 34.0522; currentLon = -118.2437; locationSource = "LOS ANGELES";
            } else {
                currentLat = fallbackLat; currentLon = fallbackLon; locationSource = "BRUSSELS (default)";
            }
        }
        await fetchWeather(currentLat, currentLon);
    }

    function tryHarvestPixels() {
        if (!img.complete || img.naturalWidth === 0) return false;
        try {
            const tCanvas = document.createElement('canvas');
            tCanvas.width = tCanvas.height = res;
            const tctx = tCanvas.getContext('2d');
            tctx.drawImage(img, 0, 0, res, res);
            const rawData = tctx.getImageData(0, 0, res, res).data;
            if (!rawData || rawData.length < (res * res * 4)) return false;
            originalPixels = [];
            for (let i = 0; i < rawData.length; i += 4) {
                originalPixels.push({ r: rawData[i], g: rawData[i+1], b: rawData[i+2] });
            }
            return originalPixels.length === (res * res);
        } catch (e) { return false; }
    }

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1],16), g: parseInt(result[2],16), b: parseInt(result[3],16) } : {r:255,g:255,b:255};
    }
    function rgbToHex(r, g, b) {
        return "#" + [r,g,b].map(x => { const hex = Math.floor(x).toString(16); return hex.length===1?"0"+hex:hex; }).join('');
    }

    img.onload = () => {
        isDataReady = tryHarvestPixels();
        try { userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch(e) {}

        const isIframe = window.self !== window.top;
        if (navigator.geolocation && !isIframe) {
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    try {
                        const geoFetch = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${currentLat}&longitude=${currentLon}&localityLanguage=en`);
                        const geoData = await geoFetch.json();
                        locationSource = (geoData.city || geoData.locality || "GPS LOC").toUpperCase();
                    } catch(geoErr) { locationSource = "GPS LOCATION"; }
                    await fetchWeather(currentLat, currentLon);
                }, 
                async () => { await fetchLocationByIP(); }
            );
        } else { fetchLocationByIP(); }

        setInterval(async () => { await fetchWeather(currentLat, currentLon); }, 300000);
        initMobileControls();
        animate();
    };

    function setWeatherByCode(code) {
        if (code <= 1) currentWeather = "CLEAR";
        else if (code <= 3) currentWeather = "CLOUDY";
        else if (code >= 95) currentWeather = "STORM";
        else if (code >= 71) currentWeather = "SNOW";
        else if (code >= 51) currentWeather = "RAIN";
        else if (code >= 45) currentWeather = "FOG";
    }

    function rotateRGB(r, g, b, angle) {
        const cosA = Math.cos(angle); const sinA = Math.sin(angle);
        const rot = [cosA+(1-cosA)/3, (1-cosA)/3-Math.sqrt(1/3)*sinA, (1-cosA)/3+Math.sqrt(1/3)*sinA,
                     (1-cosA)/3+Math.sqrt(1/3)*sinA, cosA+(1-cosA)/3, (1-cosA)/3-Math.sqrt(1/3)*sinA,
                     (1-cosA)/3-Math.sqrt(1/3)*sinA, (1-cosA)/3+Math.sqrt(1/3)*sinA, cosA+(1-cosA)/3];
        return {
            r: Math.max(0, Math.min(255, r*rot[0]+g*rot[1]+b*rot[2])),
            g: Math.max(0, Math.min(255, r*rot[3]+g*rot[4]+b*rot[5])),
            b: Math.max(0, Math.min(255, r*rot[6]+g*rot[7]+b*rot[8]))
        };
    }

    function setWeather(t, c) { currentWeather = t; weatherCode = c; }
    function setTime(h) { manualHour = h; }
    function wrap(val, max) { return ((val % max) + max) % max; }

    function getWeatherSymbol(weather, hour, code) {
        if (weather === "CLEAR") return (hour >= 6 && hour < 19) ? "☀️" : "🌙";
        if (weather === "RAIN") return (code >= 65) ? "🌧️" : "🌦️"; 
        switch (weather) {
            case "CLOUDY": return "☁️";
            case "STORM":  return "⚡";
            case "SNOW":   return "❄️";
            case "FOG":    return "🌫️";
            default:       return "🌐";
        }
    }

    function drawStatus(displayTime) {
        if (!overlayStatus) return;
        const hour = (manualHour !== null) ? manualHour : new Date().getHours();
        const symbol = getWeatherSymbol(currentWeather, hour, weatherCode);
        overlayStatus.innerText = `${symbol} ${currentWeather} // 🕒 ${displayTime} // 🌡️ ${currentTemp}°C // 💨 ${windSpeed} KM/H // 📍 ${locationSource}`;
    }

    function drawWeatherAccessories(topColor, bottomColor, jitterX = 0, jitterY = 0, mod = {r:1,g:1,b:1}) {
        if (!showGlasses) return;

        const hour = (manualHour !== null) ? manualHour : new Date().getHours();
        const isDaytime = (hour >= 6 && hour < 19);

        const jitteredEyeY = 63 + jitterY;
        const jitteredForeheadY = 46 + jitterY;

        let targetY = jitteredEyeY;
        if (currentWeather === "CLEAR") targetY = isDaytime ? jitteredEyeY : jitteredForeheadY;
        else if (currentWeather === "CLOUDY" || currentWeather === "FOG") targetY = jitteredForeheadY;

        let leftX = 50, rightX = 67, slitY = targetY + 2, slitW = 9, slitH = 7;

        let dynamicGradient = ctx.createLinearGradient(0, 0, 0, res);
        dynamicGradient.addColorStop(0, topColor || "#ffaa00");
        dynamicGradient.addColorStop(1, bottomColor || "#1a0033");

        let frameColor = "#FCE1E4";
        switch (currentWeather) {
            case "CLEAR": frameColor = isDaytime ? "#E6B2BA" : "#C599B6"; break;
            case "CLOUDY": frameColor = "#D6E2E9"; break;
            case "RAIN": frameColor = "#A9DEF9"; break;
            case "STORM": frameColor = "#E4C1F9"; break;
            case "SNOW": frameColor = "#F0F3F4"; break;
            case "FOG": frameColor = "#ADB2D4"; break;
        }

        let rgb = hexToRgb(frameColor);
        rgb.r = Math.max(0, Math.min(255, Math.floor(rgb.r * mod.r)));
        rgb.g = Math.max(0, Math.min(255, Math.floor(rgb.g * mod.g)));
        rgb.b = Math.max(0, Math.min(255, Math.floor(rgb.b * mod.b)));
        frameColor = rgbToHex(rgb.r, rgb.g, rgb.b);

        ctx.fillStyle = frameColor;
        ctx.fillRect(49 + jitterX, targetY, 11, 1);
        ctx.fillRect(48 + jitterX, targetY + 1, 13, 9);
        ctx.fillRect(49 + jitterX, targetY + 10, 11, 1);
        ctx.fillRect(66 + jitterX, targetY, 11, 1);
        ctx.fillRect(65 + jitterX, targetY + 1, 13, 9);
        ctx.fillRect(66 + jitterX, targetY + 10, 11, 1);
        ctx.fillRect(61 + jitterX, targetY, 4, 4); 

        ctx.fillStyle = dynamicGradient; 
        ctx.fillRect(leftX + jitterX, slitY, slitW, slitH);
        ctx.fillRect(rightX + jitterX, slitY, slitW, slitH);

        if (currentWeather === "RAIN") {
            let rainSeverity = (weatherCode >= 65) ? 2.0 : 1.0;
            let speedFactor = (0.015 + (windSpeed * 0.0008)) * rainSeverity;
            let totalWidthTicks = 16; 
            let currentTick = Math.floor(Date.now() * speedFactor) % totalWidthTicks;
            let wiperX = (currentTick <= 8) ? currentTick : (totalWidthTicks - currentTick);
            ctx.fillStyle = "#ffffff"; 
            ctx.fillRect(50 + wiperX + jitterX, jitteredEyeY + 2, 1, 7); 
            ctx.fillRect(67 + wiperX + jitterX, jitteredEyeY + 2, 1, 7); 
        }

        if (currentWeather === "STORM" && flashTimer > 0) {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(50 + Math.random()*7 + jitterX, jitteredEyeY + 4 + Math.random()*2, 2, 1);
            ctx.fillRect(67 + Math.random()*7 + jitterX, jitteredEyeY + 4 + Math.random()*2, 2, 1);
        }
    }

    function drawBolt() {
        ctx.strokeStyle = "white"; let x = Math.random() * res; let y = 0;
        for(let i=0; i<4; i++) {
            ctx.lineWidth = Math.max(0.5, 4 - i); ctx.beginPath(); ctx.moveTo(x, y);
            x += (Math.random() - 0.5) * 55; y += 32; ctx.lineTo(x, y); ctx.stroke();
        }
    }

    function animate() {
        if (!isDataReady) isDataReady = tryHarvestPixels();
        if (!isDataReady || originalPixels.length < (res * res)) {
            ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, res, res);
            requestAnimationFrame(animate); return;
        }

        const time = Date.now(); 
        const now = new Date();
        const hour = (manualHour !== null) ? manualHour : now.getHours();
        const displayTime = (manualHour !== null) ? hour + ":00" : now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        document.title = `BBS #${dynamicID} | ${currentWeather}`;
        const colorAngle = (time * 0.002);

        let shiver = 1.1;
        if (currentWeather === "RAIN") shiver = (weatherCode > 62) ? 2.4 : 1.4;
        else if (currentWeather === "STORM") shiver = 4.0;
        else if (currentWeather === "SNOW") shiver = 1.3;
        else if (currentWeather === "FOG") shiver = 1.4;

        const jitterX = (Math.random() - 0.5) * shiver;
        const jitterY = (Math.random() - 0.5) * shiver;

        let mod = { r: 1.25, g: 1.15, b: 1.25 };
        if (hour >= 6 && hour < 11) mod = { r: 1.4, g: 1.1, b: 1.3 };
        else if (hour >= 18 && hour < 22) mod = { r: 0.8, g: 0.7, b: 0.9 };
        else if (hour >= 22 || hour < 6) mod = { r: 0.5, g: 0.5, b: 0.55 };

        let tIdx = 0;
        for (let y = 0; y < res; y++) {
            for (let x = 0; x < res; x++) {
                let srcX = Math.round(x + (Math.random() - 0.5) * shiver);
                let srcY = Math.round(y + (Math.random() - 0.5) * shiver);
                srcX = Math.max(0, Math.min(res - 1, srcX)); 
                srcY = Math.max(0, Math.min(res - 1, srcY));
                
                let p = originalPixels[srcY * res + srcX];
                let cp = rotateRGB(p.r, p.g, p.b, colorAngle);
                let avg = (cp.r + cp.g + cp.b) / 3;
                
                d[tIdx]     = (cp.r * 1.2 + avg * (1 - 1.2)) * mod.r; 
                d[tIdx + 1] = (cp.g * 1.2 + avg * (1 - 1.2)) * mod.g; 
                d[tIdx + 2] = (cp.b * 1.2 + avg * (1 - 1.2)) * mod.b; 
                d[tIdx + 3] = 255;                                            
                tIdx += 4;
            }
        }

        let topIndex = (0 * res + 64) * 4;
        let topColor = `rgb(${Math.floor(d[topIndex])}, ${Math.floor(d[topIndex+1])}, ${Math.floor(d[topIndex+2])})`;

        let bottomIndex = ((res - 1) * res + 64) * 4;
        let bottomColor = `rgb(${Math.floor(d[bottomIndex])}, ${Math.floor(d[bottomIndex+1])}, ${Math.floor(d[bottomIndex+2])})`;

        ctx.putImageData(imgData, 0, 0);
        drawWeatherAccessories(topColor, bottomColor, jitterX, jitterY, mod);

        if (currentWeather === "RAIN" || currentWeather === "STORM") {
            ctx.strokeStyle = "rgba(180, 220, 255, 0.7)"; ctx.lineWidth = 1;
            let count = (currentWeather === "STORM" || weatherCode > 62) ? 65 : 20;
            for(let i=0; i<count; i++) {
                let p = rainDrops[i];
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + (windSpeed * 0.1), p.y + p.l); ctx.stroke();
                p.y += p.v * (currentWeather === "STORM" ? 1.4 : 1); p.x += windSpeed * 0.05;
                if(p.y > res) { p.y = -10; p.x = Math.random() * res; }
                p.x = wrap(p.x, res);
            }
        } else if (currentWeather === "SNOW") {
            ctx.fillStyle = "white";
            for(let i=0; i<40; i++) {
                let p = rainDrops[i]; let sx = wrap(p.x + Math.sin(time * 0.0008 + i) * 15, res);
                ctx.fillRect(sx, p.y, p.sz, p.sz); p.y += 0.6; p.x += windSpeed * 0.02;
                if(p.y > res) { p.y = -5; p.x = Math.random() * res; }
            }
        } else if (currentWeather === "FOG") {
            ctx.save();
            for(let j=0; j<9; j++) {
                let fx = wrap((time * 0.005 * windSpeed) + (j*45), res + 140) - 70; 
                let fy = (j % 3) * 45 + 10; 
                let mist = ctx.createRadialGradient(fx, fy, 5, fx, fy, 55);
                mist.addColorStop(0, "rgba(225, 235, 255, 0.50)");
                mist.addColorStop(0.4, "rgba(225, 235, 255, 0.25)");
                mist.addColorStop(1, "rgba(225, 235, 255, 0.0)");
                ctx.fillStyle = mist; ctx.beginPath(); ctx.arc(fx, fy, 55, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        if (currentWeather === "STORM") {
            if (Math.random() > 0.985 && flashTimer <= 0) flashTimer = 14;
            if (flashTimer > 0) {
                ctx.fillStyle = `rgba(255,255,255,${flashTimer / 25})`; ctx.fillRect(0,0,res,res);
                if (flashTimer > 8) drawBolt(); flashTimer--;
            }
        }

        drawStatus(displayTime);
        requestAnimationFrame(animate);
    }
</script>
</body>
